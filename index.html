<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Budget Interface</title>
  <style>
    :root {
      --bg: #f6f8f7;
      --card: #ffffff;
      --primary: #15803d;
      --primary-dark: #166534;
      --danger: #dc2626;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header & Budget Input */
    header {
      background: var(--primary);
      color: #fff;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    .budget-input-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .budget-input-wrap span {
      font-weight: 700;
      font-size: 1.15rem;
    }

    .budget-input-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 600;
      outline: none;
    }

    .budget-input-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.75);
    }

    /* Summary Cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 1.05rem;
    }

    .over-budget {
      color: var(--danger);
    }

    /* Add Item Form */
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.95rem;
    }

    /* Image Upload & Preview Slot */
    .photo-upload-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .photo-upload {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border: 2px dashed var(--border);
      border-radius: 9px;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }

    .photo-upload:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .photo-upload input {
      display: none;
    }

    .image-preview-box {
      width: 54px;
      height: 54px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #eef2f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 1.2rem;
    }

    .image-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* Toggle to block via JS when image is chosen */
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
    }

    /* Shopping List Items */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .item.bought {
      opacity: 0.55;
      background: #f9fafb;
    }

    .item.bought .item-info h3 {
      text-decoration: line-through;
    }

    .item-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: #eef2f0;
      border: 1px solid var(--border);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-info h3 {
      margin: 0 0 4px;
      font-size: 1rem;
      word-break: break-word;
    }

    .item-info p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-bought {
      background: #dcfce7;
      color: var(--primary-dark);
    }

    .btn-delete {
      background: #fee2e2;
      color: var(--danger);
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. Budget Input Header -->
    <header>
      <h1>🛒 Market Budget List</h1>
      <div class="budget-input-wrap">
        <span>₦</span>
        <input type="number" id="budgetInput" placeholder="Enter amount to spend (e.g. 25000)" min="0" />
      </div>
    </header>

    <!-- 2. Summary Display Strip -->
    <section class="summary">
      <div class="stat">
        <small>Budget</small>
        <strong id="budgetDisplay">₦0</strong>
      </div>
      <div class="stat">
        <small>Total List</small>
        <strong id="spentDisplay">₦0</strong>
      </div>
      <div class="stat">
        <small>Balance</small>
        <strong id="balanceDisplay">₦0</strong>
      </div>
    </section>

    <!-- 3. Add Item Form -->
    <form class="card" id="itemForm">
      <h2>Add Item to Buy</h2>
      <div class="form-grid">
        <div class="full">
          <input type="text" id="itemName" placeholder="Item name (e.g. Titus Fish, Rice, Tomatoes)" required />
        </div>
        <div>
          <input type="number" id="itemQty" placeholder="Quantity (e.g. 2)" min="1" value="1" required />
        </div>
        <div>
          <input type="number" id="itemPrice" placeholder="Unit Price (₦)" min="0" required />
        </div>

        <!-- Picture Upload + Thumbnail Preview Box -->
        <div class="full photo-upload-wrap">
          <label class="photo-upload" for="itemImage">
            📷 Add Reference Picture
            <input type="file" id="itemImage" accept="image/*" />
          </label>
          <div class="image-preview-box" id="previewBox">
            <span id="previewPlaceholder">🖼️</span>
            <img id="previewImg" src="" alt="Preview" />
          </div>
        </div>

        <div class="full">
          <button type="submit" class="btn-submit">+ Add to Market List</button>
        </div>
      </div>
    </form>

    <!-- 4. Market Items List Container (Sample cards included so you can see the layout) -->
    <section class="item-list" id="itemList">
      <article class="item">
        <div class="item-thumb">🛍️</div>
        <div class="item-info">
          <h3>Derica Rice (5 cups)</h3>
          <p>5 × ₦1,200 = <strong>₦6,000</strong></p>
        </div>
        <div class="item-actions">
          <button type="button" class="btn-small btn-bought">Bought</button>
          <button type="button" class="btn-small btn-delete">Delete</button>
        </div>
      </article>

      <article class="item bought">
        <div class="item-thumb">🐟</div>
        <div class="item-info">
          <h3>Titus Fish</h3>
          <p>2 × ₦2,500 = <strong>₦5,000</strong></p>
        </div>
        <div class="item-actions">
          <button type="button" class="btn-small btn-bought">Undo</button>
          <button type="button" class="btn-small btn-delete">Delete</button>
        </div>
      </article>
    </section>
  </div>
</body>
</html>
