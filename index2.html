<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Budget Planner</title>
  <style>
    :root {
      --bg: #f6f8f7;
      --card: #ffffff;
      --primary: #15803d;
      --primary-dark: #166534;
      --danger: #dc2626;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Green Top Header */
    header {
      background: var(--primary);
      color: #fff;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    .budget-input-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .budget-input-wrap span {
      font-weight: 700;
      font-size: 1.15rem;
    }

    .budget-input-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 600;
      outline: none;
    }

    .budget-input-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.75);
    }

    /* 3-Box Summary Strip */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 1.05rem;
    }

    /* Add this class in JS using if (balance < 0) */
    .over-budget {
      color: var(--danger);
    }

    /* Form Card */
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.95rem;
    }

    label.file-label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    /* Market List Items */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .item.bought {
      opacity: 0.6;
      text-decoration: line-through;
    }

    .item-pic {
      width: 62px;
      height: 62px;
      border-radius: 8px;
      background: #eef2f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-info h3 {
      margin: 0 0 4px;
      font-size: 1rem;
      word-break: break-word;
    }

    .item-info p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .btn-del {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-del:hover {
      background: #fecaca;
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 1. Budget Header -->
    <header>
      <h1>🛒 Market Budget Planner</h1>
      <div class="budget-input-wrap">
        <span>₦</span>
        <input type="number" id="totalBudget" placeholder="Enter market budget (e.g. 250000)" min="0" />
      </div>
    </header>

    <!-- 2. Summary Boxes (Update with your arithmetic operators: +, -, *) -->
    <div class="summary">
      <div class="stat">
        <small>Budget</small>
        <strong id="budgetDisplay">₦0</strong>
      </div>
      <div class="stat">
        <small>Total List</small>
        <strong id="spentDisplay">₦0</strong>
      </div>
      <div class="stat">
        <small>Balance</small>
        <strong id="balanceDisplay">₦0</strong>
      </div>
    </div>

    <!-- 3. Add Item Form (Push inputs into your array) -->
    <form class="card" id="itemForm">
      <div class="form-grid">
        <div class="full">
          <input type="text" id="itemName" placeholder="Item name (e.g. Titus Fish, Rice, Tomatoes)" required />
        </div>
        <div>
          <input type="number" id="itemQty" placeholder="Quantity (e.g. 2)" min="1" value="1" required />
        </div>
        <div>
          <input type="number" id="itemPrice" placeholder="Unit Price (₦)" min="0" required />
        </div>
        <div class="full">
          <label class="file-label" for="itemImage">Reference Photo (optional)</label>
          <input type="file" id="itemImage" accept="image/*" />
        </div>
        <div class="full">
          <button type="submit">+ Add to Market List</button>
        </div>
      </div>
    </form>

    <!-- 4. Item List (Loop through your array with a for loop to display items here) -->
    <div class="item-list" id="itemList">
      <div class="item">
        <div class="item-pic">🛍️</div>
        <div class="item-info">
          <h3>Sample Item(beans)</h3>
          <p>2 × ₦1,500 = <strong>₦3,000</strong></p>
        </div>
        <div class="item-actions">
          <button type="button" class="btn-small">Bought</button>
          <button type="button" class="btn-small btn-del">Delete</button>
        </div>
      </div>
    </div>
  </div>


  <script>
    let budgetInput = document.getElementById('totalBudget')
    let budgetDisplay = document.getElementById('budgetDisplay')
    let balanceDisplay = document.getElementById('balanceDisplay')
    function updateBudget() {
      let myBudget = Number(budgetInput.value)
      budgetDisplay.innerText = "₦" + myBudget;
      balanceDisplay.innerText = "₦" + myBudget
      if (myBudget < 0) {
        balanceDisplay.style.color = "red"
      } else {
        balanceDisplay.style.color = "green"
      }
    }
    budgetInput.addEventListener('input', updateBudget);
    let marketItems = [];
    let itemForm = document.getElementById('itemForm');
    let itemName = document.getElementById('itemName');
    let itemQty = document.getElementById('itemQty');
    let itemList = document.getElementById('itemList');
    let spentDisplay = document.getElementById('spentDisplay');
    let itemPrice = document.getElementById('itemPrice');
  </script>
</body>

</html>
