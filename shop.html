<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Market Run 🛒</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --card: #ffffff;
      --primary: #16a34a;
      --primary-light: #dcfce7;
      --accent: #f97316;
      --accent-light: #ffedd5;
      --danger: #ef4444;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    /* Friendly Top Banner */
    header {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      padding: 22px 20px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(22, 163, 74, 0.25);
      margin-bottom: 18px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.3px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Budget Input Box */
    .budget-box {
      background: rgba(255, 255, 255, 0.16);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .budget-box span {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .budget-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      outline: none;
    }

    .budget-box input::placeholder {
      color: rgba(255, 255, 255, 0.75);
      font-weight: 500;
    }

    /* Money Overview & Progress Bar */
    .money-card {
      background: var(--card);
      padding: 16px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .money-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 14px;
    }

    .stat-pill {
      background: #f8fafc;
      padding: 10px 6px;
      border-radius: 14px;
    }

    .stat-pill small {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .stat-pill strong {
      font-size: 1rem;
    }

    .stat-pill.balance strong {
      color: var(--primary);
    }

    /* Simple Progress Bar (Change width % with JS later) */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 45%; /* Sample fill so you can see how it looks */
      background: linear-gradient(90deg, #22c55e, #f97316);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Add Item Card */
    .form-card {
      background: var(--card);
      padding: 18px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .form-card h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    /* Fun Photo Picker */
    .photo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .photo-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      background: #f8fafc;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .photo-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    .photo-btn input {
      display: none;
    }

    .preview-circle {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      overflow: hidden;
      flex-shrink: 0;
      border: 1.5px solid #fed7aa;
    }

    .preview-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* Show with JS when user selects a pic */
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(249, 115, 22, 0.28);
      transition: transform 0.1s ease, background 0.2s;
    }

    .btn-add:hover {
      background: #ea580c;
    }

    .btn-add:active {
      transform: scale(0.98);
    }

    /* Section Title */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .list-header h3 {
      margin: 0;
      font-size: 1rem;
    }

    .list-header span {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Market Basket Cards */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 12px;
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    /* Style for when you add the 'bought' class in JS */
    .item-card.bought {
      opacity: 0.6;
      background: #f1f5f9;
    }

    .item-card.bought .item-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-pic {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      margin-bottom: 4px;
    }

    .item-title {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 700;
      word-break: break-word;
    }

    .item-math {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .item-math strong {
      color: var(--text);
    }

    .item-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-pill {
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-check {
      background: var(--primary-light);
      color: var(--primary);
    }

    .btn-remove {
      background: #fee2e2;
      color: var(--danger);
    }

    @media (max-width: 440px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. Friendly Header & Budget Input -->
    <header>
      <div class="header-top">
        <div>
          <h1>🛍️ My Market Run</h1>
          <p>Plan smart, buy sharp!</p>
        </div>
        <span class="badge">Budget Mode</span>
      </div>

      <div class="budget-box">
        <span>₦</span>
        <input type="number" id="budgetInput" placeholder="How much you wan spend?" min="0" />
      </div>
    </header>

    <!-- 2. Money Summary + Progress Bar -->
    <section class="money-card">
      <div class="money-stats">
        <div class="stat-pill">
          <small>💰 Budget</small>
          <strong id="budgetText">₦20,000</strong>
        </div>
        <div class="stat-pill">
          <small>🧾 List Total</small>
          <strong id="spentText">₦9,000</strong>
        </div>
        <div class="stat-pill balance">
          <small>✨ Balance</small>
          <strong id="balanceText">₦11,000</strong>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="progress-label">
        <span>Spending meter</span>
        <span id="percentText">45% used</span>
      </div>
    </section>

    <!-- 3. Add New Item Card -->
    <form class="form-card" id="itemForm">
